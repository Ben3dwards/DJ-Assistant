<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>DJ Assistant</title>

  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>DJ Assistant</h2>

      <nav>
        <a href="/">Chat</a>
        <a href="/tracks">Tracks</a>
        <a href="/about">About</a>
      </nav>
    </aside>

    <!-- Main -->
    <main class="main">

      <!-- Top bar -->
      <div class="topbar">
        <button id="spotify-button" class="spotify-btn">Connect Spotify</button>
      </div>

      <!-- Messages -->
      <div id="messages" class="messages"></div>

      <!-- Input -->
      <form id="chat-form" class="chat-form">
        <input
          id="message-input"
          type="text"
          placeholder="Ask for tracks, setlists, mixes..."
          autocomplete="off"
        />

        <button type="submit">Send</button>
      </form>

    </main>
  </div>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
